name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: archiflow
          POSTGRES_PASSWORD: archiflow
          POSTGRES_DB: archiflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U archiflow" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://archiflow:archiflow@localhost:5432/archiflow?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production-0000000000
      JWT_REFRESH_PEPPER: ci-refresh-pepper-not-for-production-000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
